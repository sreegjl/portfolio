<!DOCTYPE html>

<link rel="manifest" href="/files/favicon/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../notes.css">
<script src="/theme.js"></script>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(','\\)']], displayMath: [['\\[','\\]']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea'] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

<link rel="stylesheet" href="../../flashcards/flashcards.css">
</head>
<body>
<nav>
  <a href="../../../../" class="logo">@sreegjl</a>
  <div class="nav-right">
    <div class="nav-links">
      <a href="../../../../notes.html" class="nav-link active">NOTES</a>
    </div>
    <span class="nav-divider"></span>
    <button class="theme-toggle" id="themeToggle" type="button" title="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
  </div>
</nav>

<div class="fc-wrap">
  <div class="fc-topbar">
    <a class="fc-back-link" id="fcBackLink" href="#">&#8592; back</a>
    <span class="fc-topic-label" id="fcTopicLabel">flashcards</span>
    <span class="fc-counter" id="fcCounter">1 / 1</span>
  </div>

  <div class="fc-filter">
    <button class="fc-filter-btn active" data-mode="both">Both</button>
    <button class="fc-filter-btn" data-mode="formula">Formulas</button>
    <button class="fc-filter-btn" data-mode="tf">True / False</button>
    <button class="fc-filter-btn" data-mode="starred">&#9733; Starred</button>
  </div>

  <div class="fc-progress">
    <div class="fc-progress-fill" id="fcFill" style="width: 0%"></div>
  </div>

  <div class="fc-scene">
    <div class="fc-card" id="fcCard">
      <div class="fc-face fc-face-front">
        <span class="fc-face-label" id="fcFrontLabel">concept</span>
        <span class="fc-card-counter" id="fcCardCounter"></span>
        <p class="fc-concept" id="fcFront"></p>
      </div>
      <div class="fc-face fc-face-back">
        <span class="fc-face-label" id="fcBackLabel">formula</span>
        <span class="fc-card-counter" id="fcCardCounterBack"></span>
        <div class="fc-formula" id="fcBack"></div>
        <p class="fc-desc" id="fcDesc"></p>
      </div>
    </div>
  </div>

  <div class="fc-bottom">
    <p class="fc-hint" id="fcHint">tap card to reveal</p>
    <div class="fc-nav">
      <button class="fc-btn" id="fcPrev" title="Previous (&#8592;)">&#8592;</button>
      <button class="fc-btn" id="fcNext" title="Next (&#8594;)">&#8594;</button>
      <button class="fc-btn fc-star-btn" id="fcStar" title="Star this card">&#9733;</button>
      <button class="fc-btn fc-shuffle-btn" id="fcShuffle" title="Shuffle"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m19 15 3 3-3 3"/><path d="M2 6h1.9c1.5 0 2.9.9 3.5 2.2"/><path d="M22 6h-5.9c-1.3 0-2.5.6-3.3 1.7l-.5.8"/><path d="m19 3 3 3-3 3"/></svg></button>
    </div>
  </div>
</div>

<script>window.FC_TOPIC = 'dynamics';</script>
<script src="../../flashcards/decks.js"></script>
<script src="../../flashcards/flashcards.js"></script>
</body>
</html>
